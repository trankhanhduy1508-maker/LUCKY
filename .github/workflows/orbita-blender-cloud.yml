name: ORBITA Blender Cloud Probe

on:
  push:
    branches: [main]
    paths:
      - orbita_headless_cloud.py
      - .github/workflows/orbita-blender-cloud.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6

      - name: Download Blender 5.2.1 LTS
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN="$PWD/blender-5.2.1-linux-x64/blender"
          test -x "$BLENDER_BIN"
          "$BLENDER_BIN" --version
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Build and render ORBITA
        run: |
          set -euxo pipefail
          rm -rf evidence
          "$BLENDER_BIN" --background --factory-startup --python orbita_headless_cloud.py

      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence")
          m=json.loads((root/"manifest.json").read_text())
          assert m["status"]=="PASS"
          assert m["blender_version"].startswith("5.2.1")
          b=root/m["checkpoint"]["file"]
          assert b.is_file() and b.stat().st_size==m["checkpoint"]["bytes"] and b.stat().st_size>0
          assert set(m["renders"])=={"front","side","front_3q","cockpit"}
          for v in m["renders"].values():
              p=root/v["file"]; assert p.is_file() and p.stat().st_size==v["bytes"] and p.stat().st_size>0
          assert all(m["checks"].values())
          print("CWS_CLOUD_EVIDENCE_VALIDATED")
          print(json.dumps(m,indent=2,sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbita-blender-cloud-evidence
          path: evidence/
          retention-days: 3
          if-no-files-found: error
