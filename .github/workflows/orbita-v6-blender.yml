name: ORBITA Sport Final Blender
on:
  push:
    branches: [main]
    paths:
      - orbita_blender_v6.py
      - .github/workflows/orbita-v6-blender.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Blender runtime libraries
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends xz-utils libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 >/dev/null
      - name: Blender 5.2.1 LTS render
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          ./blender-5.2.1-linux-x64/blender --background --factory-startup --python orbita_blender_v6.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("v6_evidence")
          m=json.loads((root/"manifest.json").read_text())
          assert m["status"]=="PASS"
          assert m["blender_version"].startswith("5.2.1")
          blends=list(root.glob("*.blend"))
          assert len(blends)==1 and blends[0].stat().st_size>0
          assert m["blend_bytes"]==blends[0].stat().st_size
          assert set(m["renders"])=={"hero","front","side","rear_3q"}
          for key,expected_bytes in m["renders"].items():
              files=list(root.glob(f"*_{key}.png"))
              assert len(files)==1, (key, files)
              assert files[0].stat().st_size==expected_bytes and expected_bytes>0
          print("ORBITA_FINAL_VALIDATED")
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-sport-final-blender
          path: v6_evidence/
          retention-days: 3
          if-no-files-found: error
