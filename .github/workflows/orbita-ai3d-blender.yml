name: ORBITA AI3D to Blender

on:
  push:
    branches: [main]
    paths:
      - sf3d_remote.py
      - render_ai3d_blender.py
      - .github/workflows/orbita-ai3d-blender.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORBITA_IMAGE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/95ddb160-4d24-4127-84a0-57ee40723859.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2ZiMWQzYTBhMDM2YTlmYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDYyNjA4MH0.kQ9K659hBqHKvCet_4VSDBxpn2KpsDqzkfmKNeED31M"

    steps:
      - uses: actions/checkout@v4

      - name: Install Gradio client
        run: |
          python -m pip install --upgrade pip
          pip install "gradio_client>=1.3,<2" requests

      - name: Generate GLB using public SF3D
        run: |
          set -euxo pipefail
          rm -rf ai3d
          python sf3d_remote.py

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils libgl1 libegl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6

      - name: Download Blender 5.2.1 LTS
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER_BIN="$PWD/blender-5.2.1-linux-x64/blender"
          "$BLENDER_BIN" --version
          echo "BLENDER_BIN=$BLENDER_BIN" >> "$GITHUB_ENV"

      - name: Import GLB and render in Blender
        run: |
          set -euxo pipefail
          "$BLENDER_BIN" --background --factory-startup --python render_ai3d_blender.py

      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("ai3d")
          assert (root/"orbita_sf3d.glb").stat().st_size>0
          assert (root/"ORBITA_AI3D.blend").stat().st_size>0
          m=json.loads((root/"render/manifest.json").read_text())
          assert m["status"]=="PASS"
          assert m["blender_version"].startswith("5.2.1")
          assert len(m["renders"])==8
          for n,b in m["renders"].items():
              p=root/"render"/f"{n}.png"; assert p.is_file() and p.stat().st_size==b and b>0
          print("ORBITA_AI3D_EVIDENCE_VALIDATED")
          print(json.dumps(m,indent=2))
          PY

      - name: Upload AI3D Blender evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbita-ai3d-blender
          path: ai3d/
          retention-days: 3
          if-no-files-found: error
